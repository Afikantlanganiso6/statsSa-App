<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats SA | Change Management Process Selector</title><style>
:root{font-family:Arial,'Segoe UI',sans-serif;color:#142d45;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#102c49;color:white;padding:20px max(22px,calc((100vw - 1040px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:19px}header small{display:block;color:#b7d7df;margin-top:5px;font-size:12px}.brand{font-size:12px;letter-spacing:.13em;color:#92d4d1;font-weight:bold}main{max-width:900px;margin:40px auto;padding:0 18px 60px}.card{background:white;border:1px solid #e1e9ef;border-radius:15px;padding:clamp(22px,5vw,44px);box-shadow:0 10px 30px #122c4510}h1{font-size:clamp(27px,4vw,38px);margin:12px 0 12px;letter-spacing:-.035em}h2{font-size:25px;margin:12px 0 14px}p{line-height:1.6;color:#536579}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:#087f87}.muted{color:#61758a;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin:16px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}input,textarea,select{width:100%;border:1px solid #cbd9e3;border-radius:8px;padding:12px;font:inherit;background:#fff;color:#19334a}textarea{min-height:96px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #12a1a5;outline-offset:1px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:13px 23px;font:inherit;font-weight:700;cursor:pointer;background:#087d85;color:white}button:hover{filter:brightness(.94)}button.secondary{background:#eef4f6;color:#173951}button:disabled{opacity:.45;cursor:not-allowed}.progress{height:7px;background:#e6edf0;border-radius:9px;overflow:hidden;margin:20px 0 30px}.progress>div{height:100%;background:#078b92;transition:width .2s}.option{display:flex;align-items:center;gap:13px;border:1px solid #cbd9e3;border-radius:11px;padding:16px;margin:12px 0;cursor:pointer;font-weight:700}.option input{width:auto;accent-color:#087d85;transform:scale(1.2)}.option:has(input:checked){border-color:#078b92;background:#eef9f8}.tag{display:inline-block;background:#e5f5f4;color:#066b70;padding:7px 11px;border-radius:6px;font-size:12px;font-weight:700}.result{border-left:5px solid #087d85;background:#eff9f8;padding:22px;border-radius:8px;margin:20px 0}.result.exco{border-color:#a87526;background:#fff7e9}.result h2{margin:6px 0}.pill{display:inline-block;border-radius:100px;background:#eaf1f5;padding:7px 11px;font-size:12px;margin:4px 4px 4px 0}.phase{padding:17px 0;border-top:1px solid #e5edf2}.phase strong{display:block;margin-bottom:5px}.phase p{margin:0}.notice{border:1px solid #e2d6bb;background:#fffcf4;border-radius:8px;padding:14px;font-size:13px;line-height:1.6;margin-top:24px}.footer{font-size:12px;color:#718091;text-align:center;margin-top:26px}ul{line-height:1.7;color:#536579;padding-left:22px}#app{min-height:300px}@media(max-width:620px){header{padding:18px}main{margin:20px auto}.grid{grid-template-columns:1fr}.actions button{flex:1}header strong{font-size:16px}}@media print{header,.actions,.footer,.notice.print-hide{display:none}body{background:white}main{max-width:none;margin:0}.card{box-shadow:none;border:0;padding:5px}button{display:none}}
</style></head><body><header><div><div class="brand">STATISTICS SOUTH AFRICA</div><strong>Change Management Process Selector</strong><small>Integrated Business Planning | Workshop assessment</small></div><div class="brand">PEOPLE · PROCESS · CHANGE</div></header><main><div id="app" class="card"></div><div class="footer">Internal workshop prototype · No information is transmitted or centrally stored by this file.</div></main><script>
const questions=[
{section:'Roles and responsibilities',text:'Will the change affect employees’ roles, responsibilities or job descriptions?',tip:'Consider new tasks, discontinued tasks or changes to reporting responsibilities.'},
{section:'Job evaluation',text:'Will the change require a job evaluation process?',tip:'Consider whether any posts need formal re-evaluation.'},
{section:'Work environment',text:'Will the change involve relocating employees, reconfiguring workspaces or changing between office-based and field-based work?',tip:'Include changes to employees’ normal working environment.'},
{section:'Organisational structure',text:'Will the change require a new organisational structure, including adding, merging or abolishing units?',tip:'Consider any proposed changes to the formal structure.'},
{section:'Skills and competencies',text:'Will employees need new or enhanced skills through training?',tip:'Consider formal training, on-the-job training and potential budget implications.'},
{section:'Performance expectations',text:'Will the change introduce new performance measures or key performance indicators?',tip:'Include changes to how employee or team performance will be assessed.'},
{section:'Extent of impact',text:'Will the change affect other directorates, chief directorates or branches?',tip:'Consider all affected areas, not only the team implementing the initiative.'},
{section:'Workload and wellbeing',text:'Will the change increase employees’ workload or stress levels?',tip:'Consider new responsibilities, capacity constraints and employee support needs.'},
{section:'Job security',text:'Could the change lead to redundancies, redeployment or uncertainty about job security?',tip:'Include perceived uncertainty even if no redundancies are planned.'},
{section:'Approval requirements',text:'Will the change require approval above chief directorate level?',tip:'Consider the applicable delegation of authority.'},
{section:'Organised labour',text:'Will the change require communication or consultation with organised labour through the departmental bargaining chamber?',tip:'Consider any implications for employees and their conditions of work.'}
];
const phases=[['1. Plan for Change','Define the case for change, clarify the vision and scope, identify sponsors and stakeholders, and assess the people impacts.'],['2. Design and Develop Change','Develop a proportionate change management plan, stakeholder engagement approach, communication plan and learning or support interventions.'],['3. Implement Change','Engage affected teams, equip managers, communicate consistently, deliver training and address emerging concerns.'],['4. Sustain Change','Monitor adoption, gather employee feedback, reinforce new behaviours and address gaps until the change is embedded.']];
let state={page:'intro',i:0,answers:Array(11).fill(null),details:{branch:'',chief:'',project:'',description:''},reach:'',notes:''};const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(state.page==='intro')app.innerHTML=`<span class="eyebrow">Change impact assessment</span><h1>Understand your change. Choose the right pathway.</h1><p>Assess the likely impact of your initiative and identify the proposed governance route and change management support required.</p><div class="grid"><div class="field"><label for="branch">DDG / Branch</label><input id="branch" value="${esc(state.details.branch)}" placeholder="Enter branch"></div><div class="field"><label for="chief">Chief directorate</label><input id="chief" value="${esc(state.details.chief)}" placeholder="Enter chief directorate"></div></div><div class="field"><label for="project">Initiative name</label><input id="project" value="${esc(state.details.project)}" placeholder="Enter initiative name"></div><div class="field"><label for="description">Brief description</label><textarea id="description" placeholder="What is changing, and why?">${esc(state.details.description)}</textarea></div><div class="notice">This is a workshop decision-support tool. Recommendations are provisional and do not replace formal delegations, approvals or HR and labour processes.</div><div class="actions"><span></span><button onclick="begin()">Start assessment →</button></div>`;
else if(state.page==='questions'){let q=questions[state.i];app.innerHTML=`<div class="eyebrow">${esc(q.section)}</div><div class="muted" style="margin-top:10px">Question ${state.i+1} of ${questions.length}</div><div class="progress"><div style="width:${(state.i+1)/11*100}%"></div></div><h2>${esc(q.text)}</h2><p>${esc(q.tip)}</p>${['Yes','No'].map(v=>`<label class="option"><input type="radio" name="answer" value="${v}" ${state.answers[state.i]===v?'checked':''} onchange="answer('${v}')">${v}</label>`).join('')}<div class="actions"><button class="secondary" onclick="back()">← Back</button><button id="next" ${!state.answers[state.i]?'disabled':''} onclick="next()">${state.i===10?'Continue →':'Next →'}</button></div>`;}
else if(state.page==='reach')app.innerHTML=`<div class="eyebrow">Scope confirmation</div><h2>How far does this change reach?</h2><p>Choose the widest area affected by the initiative.</p>${[['chief','Within one chief directorate'],['branch','Across a single branch'],['cross','Across two or more branches'],['org','Organisation-wide']].map(([v,t])=>`<label class="option"><input type="radio" name="reach" value="${v}" ${state.reach===v?'checked':''} onchange="state.reach='${v}';document.getElementById('next').disabled=false">${t}</label>`).join('')}<div class="actions"><button class="secondary" onclick="state.page='questions';state.i=10;render()">← Back</button><button id="next" ${!state.reach?'disabled':''} onclick="state.page='results';render()">View recommendation →</button></div>`;
else results();}
function begin(){let fields=['branch','chief','project','description'];for(let k of fields)state.details[k]=document.getElementById(k).value.trim();if(!state.details.branch||!state.details.chief||!state.details.project){alert('Please enter your branch, chief directorate and initiative name.');return}state.page='questions';render()}
function answer(v){state.answers[state.i]=v;document.getElementById('next').disabled=false}function next(){if(!state.answers[state.i])return;if(state.i<10)state.i++;else state.page='reach';render()}function back(){if(state.i>0)state.i--;else state.page='intro';render()}
function classify(){let a=state.answers,yes=a.filter(x=>x==='Yes').length,flags=[];if(state.reach==='cross'||state.reach==='org')flags.push('Impact extends across branches or is organisation-wide');if(a[1]==='Yes')flags.push('Job evaluation may be required');if(a[3]==='Yes')flags.push('Organisational restructuring is indicated');if(a[8]==='Yes')flags.push('Job security, redundancy or redeployment concerns are indicated');if(a[10]==='Yes')flags.push('Organised labour consultation is indicated');if(a[9]==='Yes')flags.push('Approval above chief directorate level is indicated and the delegation must be checked');let exco=flags.length>0;return {yes,flags,exco};}
function results(){let r=classify();app.innerHTML=`<span class="eyebrow">Assessment summary</span><h1>${esc(state.details.project)}</h1><p>${esc(state.details.branch)} · ${esc(state.details.chief)}</p><div class="result ${r.exco?'exco':''}"><span class="eyebrow">Proposed governance pathway</span><h2>${r.exco?'EXCO pathway':'DDG pathway'}</h2><p>${r.exco?'One or more potential organisational escalation triggers were identified. This initiative should be reviewed for the organisational governance pathway.':'No defined escalation trigger was identified. The DDG pathway is proposed, subject to confirmation of delegated authority and scope.'}</p></div><div><span class="pill">${r.yes} of 11 Yes responses</span><span class="pill">${r.yes>=6?'Support consultation threshold reached':'Below support consultation threshold'}</span></div><h2>Why this result?</h2>${r.flags.length?`<ul>${r.flags.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>The answers did not indicate a listed organisational escalation trigger. Review the actual delegation of authority before confirming the pathway.</p>'}<p>${r.yes>=6?'Six or more Yes responses indicate that line management should consult relevant change management, project management and communication areas. This score does not itself determine EXCO routing.':'Fewer than six Yes responses were recorded. Specific employee, structural or governance risks may still require specialist consultation.'}</p>${r.exco?'<h2>Indicative organisational route</h2><p><strong>SOOD / Business Transformation and Change Hub → BTCC → CDF → EXCO</strong></p>':''}<h2>Change management actions</h2>${phases.map(p=>`<div class="phase"><strong>${p[0]}</strong><p>${p[1]}</p></div>`).join('')}<h2>Group discussion</h2><ul><li>Do we agree with this classification, and why?</li><li>Who will be affected, and how?</li><li>What consultations and approvals are required?</li><li>Which change management actions should begin first?</li><li>Who will own the next action?</li></ul><div class="field"><label for="notes">Discussion notes / next action (optional)</label><textarea id="notes">${esc(state.notes)}</textarea></div><div class="notice">PROVISIONAL WORKSHOP RECOMMENDATION. The escalation triggers used here are draft safeguards, not verified Stats SA delegations. In particular, an answer indicating approval above chief directorate level does not automatically establish EXCO authority. Confirm the route with SOOD and the relevant governance, HR and labour functions before acting.</div><div class="actions"><button class="secondary" onclick="state.page='reach';render()">← Review scope</button><button class="secondary" onclick="window.print()">Print summary</button><button onclick="download()">Export assessment (CSV) ↓</button></div><div class="actions"><button class="secondary" onclick="restart()">Start another assessment</button></div>`;}
function download(){state.notes=document.getElementById('notes').value;let r=classify();let rows=[['Field','Response'],['Branch',state.details.branch],['Chief directorate',state.details.chief],['Initiative',state.details.project],['Description',state.details.description],...questions.map((q,i)=>[q.text,state.answers[i]]),['Reach',({chief:'One chief directorate',branch:'Single branch',cross:'Multiple branches',org:'Organisation-wide'})[state.reach]],['Yes count',r.yes],['Provisional route',r.exco?'EXCO':'DDG'],['Escalation reasons',r.flags.join('; ')],['Discussion notes',state.notes],['Date',new Date().toISOString()]];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Change_Assessment_'+(state.details.project.replace(/[^a-z0-9]+/gi,'_').slice(0,35)||'result')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restart(){if(confirm('Start a new assessment? The current answers will be cleared. Export them first if needed.')){state={page:'intro',i:0,answers:Array(11).fill(null),details:{branch:'',chief:'',project:'',description:''},reach:'',notes:''};render()}}render();
</script></body></html>
